{% extends "layout.html" %}
{% block title %}Login | ATOM Learning{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-5">
        <div class="card card-elevated">
            <div class="card-body p-4">
                <h2 class="text-center mb-2">Welcome Back</h2>
                <p class="text-center text-muted mb-4">Log in to continue your learning</p>
                <form method="post">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control" id="username" name="username" autocomplete="username" required>
                    </div>
                    <div class="mb-4">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control" id="password" name="password" autocomplete="current-password" required>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-brand">Login</button>
                    </div>
                </form>
                <p class="text-center mt-3 mb-0">
                    <span class="text-muted">New here?</span>
                    <a href="{{ url_for('auth.register') }}">Create an account</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
